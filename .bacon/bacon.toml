# .bacon/bacon.toml — Autonomous coding pipeline configuration
#
# Used sections:
#   [pipeline]   — Agent routing for each pipeline stage
#   [agents.*]   — LLM configuration per agent (local or external)
#
# The [jobs.*] sections below serve the `bacon` CI watcher tool (third-party),
# not the autonomous pipeline. Preserved for CI usage.

[pipeline]
# Agent routing for each pipeline stage.
# Values: "bacon" (built-in) or an agent name from [agents.<name>].command_args (e.g., "nvidia").
# The built-in "bacon" agents implement SEARCH/REPLACE parsing, file patching,
# check-fast.ps1 gating, and retry loops. External agents are text-only wrappers.
observer = "nvidia"
strategist = "nvidia"
coder = "bacon"
auditor = "bacon"
# Delay (ms) between pipeline stages to avoid LLM API rate limiting.
# Default: 0 (no delay). Set to 1000 for 1s between consecutive stages.
stage_delay_ms = 500

# Whether to auto-apply Coder patches without user confirmation.
# When true, patches that pass check-fast.ps1 are applied automatically.
# The CLI `--auto-apply` flag overrides this value.
# Default: false.
enable_auto_apply = false

# ── CI watcher jobs (bacon CLI) ──────────────────────────────────
# These job definitions are consumed by the external `bacon` CI
# watcher tool, not by the autonomous pipeline. Preserved here
# for workspace-aware CI workflows.

[jobs.ai_obs]
command = ["cargo", "clippy", "--message-format=json", "--", "-D", "warnings"]
need_stdout = true
description = "Observer: Extract compiler warnings and errors"

[jobs.ai_deadlock_check]
command = ["cargo", "check", "--features", "deadlock_detection"]
need_stdout = true
description = "Deadlock detection in concurrent code"
timeout_seconds = 120

[jobs.ai_audit]
command = ["cargo", "test", "--all-features", "--", "--nocapture"]
need_stdout = true
description = "Auditor: Run comprehensive test suite"
timeout_seconds = 600

[jobs.ai_performance]
command = ["cargo", "bench", "--", "--nocapture"]
need_stdout = false
description = "Performance regression detection"
timeout_seconds = 900

[jobs.ai_security]
command = ["cargo", "audit", "--json"]
need_stdout = true
description = "Security vulnerability scanning"
timeout_seconds = 180

[jobs.ai_format]
command = ["cargo", "fmt", "--", "--check"]
need_stdout = true
description = "Code formatting verification"
timeout_seconds = 60

# ── Agent LLM configuration ─────────────────────────────────────
# Each [agents.<name>] section is read by PipelineConfig::agent_llm_config()
# and run_external_agent() at runtime. Supports:
#
#   type         — "local" (in-process) or "external" (CLI worker)
#   provider     — "ollama", "openai", "anthropic", "cli", or "nvidia"
#   model        — Model name/ID
#   temperature  — LLM temperature (0.0–1.0)
#   command_args — CLI arguments with {prompt} and {role} placeholders
#   api_key      — API key (supports {env:VAR_NAME} references)
#   base_url     — API base URL
#   top_p        — Nucleus sampling parameter
#   max_tokens   — Maximum output tokens

# NVIDIA agent — requires NVIDIA_API_KEY env var.
# Used by all 4 pipeline stages (observer, strategist, coder, auditor).
[agents.nvidia]
type = "external"
provider = "nvidia"
command_args = ["-p", "{prompt}", "--role", "{role}"]
api_key = "{env:NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.3-70b-instruct"
temperature = 0.3
top_p = 0.95
max_tokens = 16384
