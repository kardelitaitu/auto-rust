# .bacon/bacon.toml — Autonomous coding pipeline configuration
#
# Used sections:
#   [pipeline]   — Agent routing for each pipeline stage
#   [agents.*]   — LLM configuration per agent (local or external)
#
# The [jobs.*] sections below serve the `bacon` CI watcher tool (third-party),
# not the autonomous pipeline. Preserved for CI usage.

[pipeline]
# Agent routing for each pipeline stage.
# Values: "nvidia" (built-in), "bacon" (built-in), or an agent name from [agents.<name>].
# Built-in agents use the modern unified LLM client and localized logic.
observer = "nvidia_observer"
strategist = "nvidia_strategist"
coder = "nvidia_coder"
auditor = "nvidia_auditor"
# Delay (ms) between pipeline stages to avoid LLM API rate limiting.
stage_delay_ms = 1000

# Whether to auto-apply Coder patches without user confirmation.
enable_auto_apply = false

# ── CI watcher jobs (bacon CLI) ──────────────────────────────────
# These job definitions are consumed by the external `bacon` CI
# watcher tool, not by the autonomous pipeline. Preserved here
# for workspace-aware CI workflows.

[jobs.ai_obs]
command = ["cargo", "clippy", "--message-format=json", "--", "-D", "warnings"]
need_stdout = true
description = "Observer: Extract compiler warnings and errors"

[jobs.ai_deadlock_check]
command = ["cargo", "check", "--features", "deadlock_detection"]
need_stdout = true
description = "Deadlock detection in concurrent code"
timeout_seconds = 180

[jobs.ai_audit]
command = ["cargo", "test", "--all-features", "--", "--nocapture"]
need_stdout = true
description = "Auditor: Run comprehensive test suite"
timeout_seconds = 600

[jobs.ai_performance]
command = ["cargo", "bench", "--", "--nocapture"]
need_stdout = false
description = "Performance regression detection"
timeout_seconds = 900

[jobs.ai_security]
command = ["cargo", "audit", "--json"]
need_stdout = true
description = "Security vulnerability scanning"
timeout_seconds = 180

[jobs.ai_format]
command = ["cargo", "fmt", "--", "--check"]
need_stdout = true
description = "Code formatting verification"
timeout_seconds = 120

# ── Agent LLM configuration ─────────────────────────────────────
# Each [agents.<name>] section is read by PipelineConfig::agent_llm_config()
# and used to initialize the stage-specific LLM client.

[agents.nvidia_observer]
provider = "nvidia"
model = "meta/llama-3.3-70b-instruct"
api_key = "{env:NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"
temperature = 0.4
max_tokens = 8192
timeout_ms = 90000

[agents.nvidia_strategist]
provider = "nvidia"
model = "meta/llama-3.3-70b-instruct"
api_key = "{env:NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"
temperature = 0.1
max_tokens = 8192
timeout_ms = 90000

[agents.nvidia_coder]
provider = "nvidia"
model = "meta/llama-3.3-70b-instruct"
api_key = "{env:NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"
temperature = 0.0
max_tokens = 16384
timeout_ms = 120000

[agents.nvidia_auditor]
provider = "nvidia"
model = "meta/llama-3.3-70b-instruct"
api_key = "{env:NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"
temperature = 0.1
max_tokens = 16384
timeout_ms = 90000

# Base NVIDIA agent — preserved for backward compatibility
[agents.nvidia]
type = "external"
provider = "nvidia"
command_args = ["-p", "{prompt}", "--role", "{role}"]
api_key = "{env:NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.3-70b-instruct"
temperature = 0.3
top_p = 0.95
max_tokens = 16384
timeout_ms = 90000
