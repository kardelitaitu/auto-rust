# ========================================
# Global build settings (.cargo/config.toml)
# ========================================

# ========================================
# Command Aliases
# ========================================
[alias]
t = "test --all-features"
f = "fmt --all -- --check"

[build]
# Use physical cores for CPU-intensive compilation (8 threads = 8 jobs)
# Over-allocating jobs can cause context switching overhead and memory pressure
jobs = 8

# sccache intentionally not configured in this repository.
# Keep builds on plain Cargo incremental compilation for reliability.
# Explicitly disable sccache even if RUSTC_WRAPPER is set in the environment
# (sccache fails on /mnt/c/ in WSL due to Unix permission issues on Windows FS)
# rustc-wrapper = ""

# Faster linker on Windows (lld-link is usually the best stable choice)
[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files\\LLVM\\bin\\lld-link.exe"

# Optional: Extra rustflags for even more speed (uncomment if you want to experiment)
# rustflags = ["-C", "link-arg=/STACK:8388608"]  # larger stack for deep recursion

# ========================================
# Profiles (Cargo.toml)
# ========================================

[profile.dev]
opt-level = 0                    # No optimizations → fastest codegen
debug = "none"                   # 0, 1, 2, "none", "limited", "full", "line-tables-only", or "line-directives"
split-debuginfo = "unpacked"     # Helps reduce linking time (works on Windows)
incremental = true               # Keep this for fast edit-compile cycles
lto = "off"                      # Disable all LTO for dev speed
codegen-units = 8                # Optimal for 8 threads
overflow-checks = false          # Small extra speedup (optional)

# Minimal debug info for all dependencies (big win!)
[profile.dev.package."*"]
debug = false
opt-level = 0

# ========================================
# Build dependencies (proc macros, build.rs, etc.)
# Compile them with optimizations for faster builds
[profile.dev.build-override]
opt-level = 3
codegen-units = 8

# ========================================
# Release profiles (kept reasonable)
[profile.release]
opt-level = 3
lto = "thin"                     # Best balance for most projects (fast compile + good perf)
codegen-units = 8                # Parallel codegen units for faster compilation
incremental = true               # Enable incremental compilation for release builds
debug = false
strip = "debuginfo"              # Or change to `true` for smaller binaries
panic = "unwind"                 # Explicit (default); change to "abort" if you don't need unwinding
overflow-checks = false          # Default, but good to be explicit

[profile.release.build-override]
opt-level = 3
codegen-units = 8

# Fast but lighter release (for quick testing)
[profile.fast-release]
inherits = "release"
lto = "off"
codegen-units = 8
opt-level = 2
