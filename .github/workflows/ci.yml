name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest

      - name: Build check
        run: cargo check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy — ban .unwrap() in production code
        run: cargo clippy --lib -- -D warnings -D clippy::unwrap_used

      - name: Clippy — ban .expect() in production code
        run: cargo clippy --lib -- -D warnings -D clippy::expect_used

      - name: Clippy — ban unwrap/expect in binary targets
        run: cargo clippy --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: Run tests with nextest
        run: cargo nextest run --all-features --profile ci

      - uses: ./.github/actions/sccache-stats
        if: always()

