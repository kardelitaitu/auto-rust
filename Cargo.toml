[workspace]
members = [".", "crates/bacon-pipeline"]
exclude = ["fuzz"]

[package]
name = "auto-rust"
version = "0.2.3"
edition = "2021"
autobins = false
default-run = "nvidia"
authors = ["Ganteng Maksimal"]
description = "High-performance multi-browser automation framework built in Rust"
license = "MIT"
repository = "https://github.com/your-org/rust-orchestrator"
keywords = ["automation", "browser", "orchestration", "testing"]
categories = ["development-tools", "web-programming"]

[features]
default = []
accessibility-locator = []

[lib]
name = "auto"
path = "src/lib.rs"

[[bin]]
name = "auto"
path = "src/main.rs"

[[bin]]
name = "bacon-test"
path = "src/bin/bacon-test.rs"

[[bin]]
name = "bacon"
path = "src/bin/bacon.rs"

[[bin]]
name = "nvidia"
path = "src/bin/nvidia_simple.rs"

[[bin]]
name = "bacon-spec"
path = "src/bin/bacon-spec.rs"

[[bin]]
name = "bacon-coder"
path = "src/bin/bacon-coder.rs"

[[bin]]
name = "bacon-review"
path = "src/bin/bacon-review.rs"

[dependencies]
# CDP Browser Automation
chromiumoxide = { version = "0.6", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "signal", "macros"] }
tokio-util = "0.7"

# CLI Parsing
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tempfile = "3"
env_logger = "0.11"

# HTTP & Networking
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error Handling
anyhow = "1"
thiserror = "1"

# Async Utilities
futures = "0.3"
async-trait = "0.1"
enigo = "0.6.1"

# Random & Probability
rand = "0.8"
rand_distr = "0.4"

# File & Path Utilities
glob = "0.3"
notify = "6"

# Image Processing
image = { version = "0.24", features = ["webp"] }
webp = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot = "0.12"
dashmap = "5"
sysinfo = "0.30"

# Regex
regex = "1"

# Fast HashMap
rustc-hash = "2"

# Lazy Static / Once Cell
once_cell = "1"
log = "0.4.29"
do-over = "0.1.0"
bacon-pipeline = { path = "crates/bacon-pipeline" }

[lints.clippy]
# Performance-focused lints (added Phase 1)
# Run `cargo clippy -- -W clippy::pedantic` for full pedantic audit
inefficient_to_string = "warn"
unnecessary_to_owned = "warn"

[profile.dev]
# Optimize dev builds for speed
incremental = true
codegen-units = 256           # More parallel codegen units for faster builds
opt-level = 0                 # No optimizations for fast compiles
debug = "line-tables-only"    # Minimal debug info for faster linking
overflow-checks = false       # Disable overflow checks for speed
lto = false                   # Disable LTO for dev

# Release profile: maximum runtime performance, smaller binaries
[profile.release]
# Note: inherits not used — this IS the release profile
lto = true                    # Full link-time optimization (fat LTO)
codegen-units = 1             # Single codegen unit for maximum optimization
opt-level = 3                 # Max optimization
overflow-checks = true        # Keep safety checks in release
strip = "symbols"             # Remove debug symbols for smaller binary
# Note: panic=abort would be smaller/faster but is avoided because the
# orchestrator relies on catch_unwind for task isolation in multi-session execution.
# Keeping default unwinding for graceful failure recovery.

# Custom profile for TDD: maximum compile speed, readable backtraces
[profile.tdd]
inherits = "dev"
strip = "debuginfo"


[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
proptest = "1.5"
criterion = "0.5"


[[example]]
name = "demo-interaction-keyboard"
path = "src/task/demo-interaction-keyboard.rs"

[[example]]
name = "demo-interaction-mouse"
path = "src/task/demo-interaction-mouse.rs"

[[bench]]
name = "trajectory"
path = "src/benchmarks/trajectory.rs"
harness = false

[[bench]]
name = "accessibility_locator"
path = "src/benchmarks/accessibility_locator.rs"
harness = false
required-features = ["accessibility-locator"]

[[bench]]
name = "predictive_scorer"
path = "src/benchmarks/predictive_scorer.rs"
harness = false
