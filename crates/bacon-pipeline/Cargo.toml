[package]
name = "bacon-pipeline"
version = "0.1.0"
edition = "2021"
description = "Portable gated-LLM automation pipeline (Observer → Strategist → Coder → Auditor)"
license = "MIT"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
