acceptance:
  - auditor.rs gains a #[cfg(test)] mod tests block with tests for role_prompt(), promote_to_done(), and mark_needs_approval()
  - observer.rs gains a #[cfg(test)] mod tests block with tests for system_prompt() and early-return logic paths
  - pipeline.rs gains a #[cfg(test)] mod tests block with tests for Pipeline::new(), PipelineConfig validation, and stage dispatch
  - All 3 files compile cleanly (cargo check) alongside unchanged tests
  - cargo test passes all existing + new tests
non_goals:
  - No integration or end-to-end pipeline tests (LLM calls would be needed)
  - No mocking frameworks — use temp directories and filesystem ops where needed
  - No changes to production code behavior — only test additions
risks:
  - promote_to_done() calls spec-lint.ps1 via PowerShell, which may not be available in all environments — tests should check for failure gracefully
  - mark_needs_approval() writes to the filesystem — tests must use temp directories
