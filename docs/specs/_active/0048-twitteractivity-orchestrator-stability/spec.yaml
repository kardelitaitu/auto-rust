acceptance:
  - `run()` keeps a hard timeout boundary and returns a clear timeout error when the session exceeds the configured duration.
  - `TaskConfig::from_payload()` keeps the current payload contract and rejects invalid inputs with a readable validation error.
  - `run_inner()` keeps the current phase wiring: persona setup, navigation, scanning, candidate processing, and summary logging.
  - `build_summary_lines()` keeps summary keys and remaining-limit keys stable for downstream parsing.
  - The task-level regression tests and integration tests stay green.
  - `./check-fast.ps1`, `./check.ps1`, and `spec-lint.ps1` pass for this package.
non_goals:
  - Replace the helper-module architecture.
  - Add new Twitter/X actions.
  - Change engagement heuristics or persona math unless a bug blocks correctness.
risks:
  - Summary format changes can break log assertions.
  - Randomized entry-point behavior can make tests flaky if coverage is too narrow.
  - Timeout and loop thresholds can drift if config defaults change without matching test updates.
