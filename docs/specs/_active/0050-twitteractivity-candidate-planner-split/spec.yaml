acceptance:
  - Candidate planning is extracted into a pure shared planner with no browser dependency.
  - Live candidate execution uses the planner output and keeps current action ordering and limits intact.
  - Simulation reuses the same planner contract so live and simulated decisions stay aligned.
  - Plan output is deterministic for the same seed, payload snapshot, and runtime state inputs.
  - Regression tests cover planner output shape, live execution wiring, and simulation reuse.
  - `spec-lint.ps1`, `./check-fast.ps1`, and `./check.ps1` pass for the package.
non_goals:
  - Rewriting Twitter navigation or feed scanning.
  - Changing the engagement probability model.
  - Adding new actions or new UI behavior.
risks:
  - Planner/executor drift if the boundary is too loose.
  - Over-abstracting the plan may make live behavior harder to debug.
  - Seeded simulation can still miss browser-specific edge cases.
