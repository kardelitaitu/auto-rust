acceptance:
  - NVIDIA_TOP_P env var is read by load_nvidia_config_from_env() and applied as config override
  - `bacon test` subcommand executes cargo test -p bacon-pipeline and reports results
  - Stage timing metrics (duration per stage) are logged and available in PipelineCtx
  - --parallel flag spawns independent specs in concurrent tokio tasks (2+ speedup)
  - Ollama-compatible response parsing is supported in the LLM client via provider switch
  - An end-to-end pipeline integration test exists (not #[ignore])
  - A persistent run log (.bacon/sessions/run-log.yaml) tracks spec outcomes across runs
  - --ci flag emits GitHub Actions-compatible JSON annotations on stdout
  - Env var table in .bacon/workflow.md matches all env vars actually read by code
non_goals:
  - Full OpenRouter provider support (out of scope; restricted by validate_bacon_local_only())
  - Web UI or dashboard for pipeline monitoring
  - Migration away from GPT-4o or specific model tuning
  - Pipeline auto-scaling across multiple machines
risks:
  - Parallel execution may cause git conflicts if specs touch overlapping files
  - Ollama support may diverge from NVIDIA format if Ollama API changes
  - Adding new subcommands increases CLI surface area and maintenance burden
