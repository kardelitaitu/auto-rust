non_goals:
  - No behavioral changes to DSL execution logic
  - No renaming of public types or functions consumed outside dsl/
  - No changes to the DSL YAML/TOML syntax or semantics
  - No refactoring of cache or debug/profiling methods (stay in executor.rs)
  - No extraction of execute_call (stays in executor.rs)
risks:
  - execute_ handlers reference `self.api`, `self.cache_ttl`, `self.selector_cache` — extracted modules need `&mut DslExecutor` or `&DslApi`
  - Handler functions call `self.clear_cache()` and `self.substitute_variables()` — these helpers stay in executor.rs and extracted handlers call through a dispatch pattern
  - Tests use `MockDslApi` from `dsl::api::mock` — must be accessible from action submodule test modules
