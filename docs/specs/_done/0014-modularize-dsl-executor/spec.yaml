acceptance:
  - "executor.rs non-test code reduced from 864 lines to ≤500 lines (only dispatch + orchestration + struct remains)"
  - "executor.rs total file reduced from 4736 lines to ≤1000 lines (accounting for remaining dispatch tests)"
  - "Action handler functions extracted into 4 focused submodules under actions/"
  - "Each extracted submodule compiles independently via `cargo check` with no dead_code warnings"
  - "All 3466+ existing tests pass without behavioral changes"
  - "`cargo clippy --all-targets` shows no new warnings"
