version: 1
id: 0031-scroll-tweet-into-viewport
title: Scroll tweet into viewport before feed-level engagement and add retweet confirm fallback
status: done
owner: spec-agent
implementer: archived-pending
priority: P2
area:
  - anti-detection
  - human behavior
  - twitter
files:
  code:
    - src/utils/twitter/engagement/dispatch.rs
    - src/utils/twitter/twitteractivity_actions.rs
    - src/utils/twitter/js/js_scroll_and_get_tweet_button.js
  docs:
    - docs/specs/_done/0031-scroll-tweet-into-viewport/spec.yaml
