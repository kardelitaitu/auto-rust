acceptance:
  - "Before performing feed-level engagement actions (like, retweet, bookmark), the target tweet is scrolled into the center of the viewport."
  - "The button coordinates are retrieved after the scroll has completed to ensure alignment."
  - "The retweet_at_position function includes a selector-based fallback click if coordinate-based clicks fail to open the confirm dropdown."
  - "All unit and integration tests compile and pass successfully."
non_goals:
  - "Do not alter the behavior of thread dives or detail-view engagements."
  - "Do not change the scrolling behavior of the main scanning loop."
risks:
  - "Scrolling too quickly or excessively might look robotic if not paired with human-like pauses."
