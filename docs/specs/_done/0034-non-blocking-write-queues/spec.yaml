acceptance:
  - "TwitterPersistenceState updates are sent to a background write queue asynchronously instead of performing synchronous disk writes on worker threads."
  - "The background writer runs updates sequentially, avoiding filesystem locks entirely."
  - "Task workers can queue write commands without blocking on file system locks."
  - "Existing test suite compiles and runs cleanly."
non_goals:
  - "We do not change the persistence schema or database format."
risks:
  - "If the application crashes before the queue is processed, updates could be lost. We should ensure the queue is flushed during graceful shutdown."
