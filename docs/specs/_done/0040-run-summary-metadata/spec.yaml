version: 1
id: 0040-run-summary-metadata
title: Run summary metadata
status: done
owner: spec-agent
implementer: archived-pending
priority: P2
area:
  - metrics
  - results
  - reporting
files:
  code:
    - src/result.rs
    - src/metrics.rs
    - src/task/mod.rs
    - src/tests/result_tests.rs
  docs:
    - docs/specs/_done/0040-run-summary-metadata/README.md
    - docs/specs/_done/0040-run-summary-metadata/plan.md
    - docs/specs/_done/0040-run-summary-metadata/validation.md
    - docs/specs/_done/0040-run-summary-metadata/notes.md
acceptance:
  - `TaskResult` can carry an optional `metadata: Option<BTreeMap<String, String>>` payload, serde-defaults it to `None`, and keeps existing constructors source-compatible.
  - `MetricsCollector::task_completed_from_result` copies `TaskResult.metadata` into `TaskMetrics.metadata`.
  - `run-summary.json` includes a top-level `task_metadata` array of `{ task_name, session_id, attempt, metadata }` records only when metadata is present, and leaves existing counters unchanged when absent.
  - `./check.ps1` passes after the change.
non_goals:
  - Add a dashboard or UI for the metadata.
  - Change task execution behavior.
  - Add metadata to every task immediately.
risks:
  - A too-generic metadata shape could become a dumping ground.
  - JSON output size may grow if payloads are not kept small.
  - Additional serde fields can make tests brittle if they are over-specified.
