acceptance:
  - The task uses `api.pause_human()` exclusively for human-like pauses.
  - The task uses `crate::capabilities::scroll` instead of `window.scrollBy`.
  - `check_end_of_thread` accurately detects the bottom without relying on raw article counts.
  - `tweets_read` accurately reflects unique tweets passed, not scroll iterations.
non_goals:
  - Adding new automated engagement actions (likes/retweets) to this specific task.
  - Refactoring the underlying `scroll.rs` module itself.
risks:
  - DOM changes could break unique ID tracking for the read metric.
  - Relying on scroll delta might falsely trigger end-of-thread if the network is extremely slow.
