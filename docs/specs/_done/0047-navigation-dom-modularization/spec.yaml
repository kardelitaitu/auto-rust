acceptance:
  - `src/utils/dom.rs` is created and contains all DOM element query and inspection logic.
  - `src/utils/navigation.rs` is significantly reduced in size and only contains page routing/lifecycle logic.
  - `src/utils/mod.rs` exposes both modules appropriately.
  - Existing integrations and `TaskContext` methods that wrap these utilities still compile and function identically.
  - All existing unit tests pass.
non_goals:
  - Altering the Javascript evaluation logic underneath the DOM queries.
  - Changing the behavior of page loading timeouts.
risks:
  - Misclassification of functions (e.g., putting `wait_for_page_settle` in `dom.rs` instead of `navigation.rs`) could lead to circular dependencies if they rely on each other.
